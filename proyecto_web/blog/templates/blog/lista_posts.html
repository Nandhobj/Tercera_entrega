{% extends "blog/base.html" %}

{% block contenido %}

<div class="card">
    <h2>Lista de Posts</h2>

    {% if posts %}
        <ul>
            {% for post in posts %}
                <li>
                    {{ post.titulo }}
                    <a href="{% url 'detalle_post' post.id %}">Leer más</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No hay posts aún.</p>
    {% endif %}

    <p><a href="{% url 'crear_post' %}">Crear nuevo post</a></p>
</div>

{% endblock %}
