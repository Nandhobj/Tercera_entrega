{% extends "blog/base.html" %}

{% block contenido %}

<div class="card">
    <h2>Eliminar Post</h2>

    <p>¿Seguro que querés eliminar <strong>{{ post.titulo }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'detalle_post' post.id %}" style="margin-left:10px;">Cancelar</a>
    </form>
</div>

{% endblock %}
