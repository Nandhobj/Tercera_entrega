<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blog Django</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            margin: 0;
        }

        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background: #555;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd700;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 10px auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #333;
            color: white;
            margin-top: 20px;
        }
    </style>

</head>
<body>

<header>
    <h1>Mi Blog </h1>
    <p>Tercera entrega</p>
</header>

<nav>
    <a href="/">Inicio</a>
    <a href="/admin/">Admin</a>
</nav>

<div class="container">
    {% block contenido %}
    {% endblock %}
</div>

<footer>
    <p>Proyecto Coderhouse</p>
</footer>

</body>
</html>
