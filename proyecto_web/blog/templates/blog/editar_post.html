{% extends "blog/base.html" %}

{% block contenido %}

<div class="card">
    <h2>Editar Post</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar cambios</button>
        <a href="{% url 'lista_posts' %}" style="margin-left:10px;">Cancelar</a>
    </form>
</div>

{% endblock %}
