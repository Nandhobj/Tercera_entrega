{% extends "blog/base.html" %}

{% block contenido %}
<div class="card">
    <h2>Editar perfil</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <h3>Datos de usuario</h3>
        {{ user_form.as_p }}

        <h3>Datos de perfil</h3>
        {{ profile_form.as_p }}

        <button type="submit">Guardar</button>
        <a href="{% url 'profile' %}" style="margin-left:10px;">Cancelar</a>
    </form>
</div>
{% endblock %}
